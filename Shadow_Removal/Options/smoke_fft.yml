# general settings
name: smoke_fft
model_type: ImageCleanModel
scale: 1
num_gpu: 0
manual_seed: 100

# dataset and data loader settings
datasets:
  train:
    name: Smoke_Train
    type: Dataset_PairedImage
    dataroot_gt: ./RDD_data/smoke/train/gt
    dataroot_lq: ./RDD_data/smoke/train/img
    geometric_augs: false
    filename_tmpl: '{}'
    io_backend:
      type: disk
    use_shuffle: true
    num_worker_per_gpu: 0
    batch_size_per_gpu: 2
    mini_batch_sizes: [2]
    iters: [10]
    gt_size: 64
    gt_sizes: [64]
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: Smoke_Val
    type: Dataset_PairedImage
    dataroot_gt: ./RDD_data/smoke/val/gt
    dataroot_lq: ./RDD_data/smoke/val/img
    io_backend:
      type: disk

# network structures
network_g:
  type: Restormer
  inp_channels: 3
  out_channels: 3
  dim: 16
  num_blocks: [1, 1, 1, 1]
  num_refinement_blocks: 1
  heads: [1, 1, 1, 1]
  ffn_expansion_factor: 2.0
  bias: False
  LayerNorm_type: WithBias
  dual_pixel_task: False

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  total_iter: 10
  warmup_iter: -1
  use_grad_clip: true

  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [5, 5]
    restart_weights: [1, 1]
    eta_mins: [0.0003, 0.000001]

  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

  fft_opt:
    type: FFTLoss
    loss_weight: 0.1
    reduction: mean

# validation settings
val:
  window_size: 8
  val_freq: 5
  save_img: false
  rgb2bgr: true
  use_image: true
  max_minibatch: 1

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
    rmse:
      type: calculate_rmse
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 2
  save_checkpoint_freq: 5
  use_tb_logger: false
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
